name: Deploy to EC2 on main

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> AWS IAM role (no long-lived AWS keys)
  contents: read

concurrency:
  group: deploy-prod-socket
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 via SSM (build on host, restart socket only)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "BabMukDang-Socket ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$(jq -nc --arg c "/opt/babmuckdang/deploy.sh socket ${GITHUB_SHA}" '{commands:[$c],executionTimeout:["1500"]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          while :; do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 80
          [ "$S" = Success ] || { echo "Deploy $S"; exit 1; }
